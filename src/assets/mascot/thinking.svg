<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGradThink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bellyGradThink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glowThink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="120" cy="305" rx="55" ry="10" fill="rgba(0,0,0,0.2)" />

  <!-- Antenna (curious slant) -->
  <line x1="120" y1="45" x2="110" y2="18" stroke="#0369a1" stroke-width="6" stroke-linecap="round" />
  <circle cx="108" cy="14" r="10" fill="#f59e0b" filter="url(#glowThink)" />
  <circle cx="106" cy="11" r="3" fill="#fef3c7" />

  <!-- Floating Question Sparkle -->
  <circle cx="175" cy="40" r="5" fill="#f59e0b" filter="url(#glowThink)" />
  <circle cx="190" cy="25" r="3" fill="#f59e0b" filter="url(#glowThink)" />

  <!-- Feet -->
  <ellipse cx="90" cy="295" rx="20" ry="12" fill="#0369a1" />
  <ellipse cx="150" cy="295" rx="20" ry="12" fill="#0369a1" />

  <!-- Left Arm (Holding elbow) -->
  <path d="M 50 140 Q 40 180 85 185" fill="none" stroke="#0284c7" stroke-width="16" stroke-linecap="round" />
  <circle cx="85" cy="185" r="11" fill="#38bdf8" />

  <!-- Right Arm (Hand under chin) -->
  <path d="M 190 140 Q 180 180 135 150" fill="none" stroke="#0284c7" stroke-width="16" stroke-linecap="round" />
  <circle cx="130" cy="145" r="12" fill="#38bdf8" />

  <!-- Body Capsule -->
  <rect x="50" y="45" width="140" height="240" rx="70" fill="url(#bodyGradThink)" />

  <!-- Belly Plate -->
  <rect x="75" y="160" width="90" height="95" rx="30" fill="url(#bellyGradThink)" />
  <circle cx="120" cy="205" r="8" fill="#f59e0b" filter="url(#glowThink)" />

  <!-- Visor -->
  <rect x="68" y="80" width="104" height="60" rx="26" fill="#0f172a" />

  <!-- Eyes (Looking up thoughtfully) -->
  <ellipse cx="96" cy="104" rx="9" ry="11" fill="#38bdf8" />
  <circle cx="94" cy="99" r="3.5" fill="#ffffff" />

  <ellipse cx="140" cy="104" rx="9" ry="11" fill="#38bdf8" />
  <circle cx="138" cy="99" r="3.5" fill="#ffffff" />

  <!-- Puzzled / Thoughtful Mouth -->
  <path d="M 114 126 Q 120 123 126 128" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
</svg>
