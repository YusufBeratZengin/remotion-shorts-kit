<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGradSurprise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bellyGradSurprise" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glowSurprise" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="120" cy="305" rx="55" ry="10" fill="rgba(0,0,0,0.2)" />

  <!-- Antenna (vibrating) -->
  <line x1="120" y1="45" x2="120" y2="15" stroke="#0369a1" stroke-width="6" stroke-linecap="round" />
  <circle cx="120" cy="12" r="11" fill="#ef4444" filter="url(#glowSurprise)" />
  <circle cx="118" cy="9" r="3.5" fill="#fee2e2" />

  <!-- Exclamation Rays -->
  <line x1="100" y1="10" x2="90" y2="2" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  <line x1="140" y1="10" x2="150" y2="2" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />

  <!-- Feet -->
  <ellipse cx="88" cy="295" rx="20" ry="12" fill="#0369a1" />
  <ellipse cx="152" cy="295" rx="20" ry="12" fill="#0369a1" />

  <!-- Left Arm (Raised Up) -->
  <path d="M 50 140 Q 20 110 32 80" fill="none" stroke="#0284c7" stroke-width="16" stroke-linecap="round" />
  <circle cx="32" cy="80" r="11" fill="#38bdf8" />

  <!-- Right Arm (Raised Up) -->
  <path d="M 190 140 Q 220 110 208 80" fill="none" stroke="#0284c7" stroke-width="16" stroke-linecap="round" />
  <circle cx="208" cy="80" r="11" fill="#38bdf8" />

  <!-- Body Capsule -->
  <rect x="50" y="45" width="140" height="240" rx="70" fill="url(#bodyGradSurprise)" />

  <!-- Belly Plate -->
  <rect x="75" y="160" width="90" height="95" rx="30" fill="url(#bellyGradSurprise)" />
  <circle cx="120" cy="205" r="9" fill="#ef4444" filter="url(#glowSurprise)" />

  <!-- Visor -->
  <rect x="68" y="78" width="104" height="64" rx="26" fill="#0f172a" />

  <!-- Wide Surprised Eyes -->
  <circle cx="96" cy="106" r="14" fill="#38bdf8" />
  <circle cx="96" cy="106" r="6" fill="#ffffff" />

  <circle cx="144" cy="106" r="14" fill="#38bdf8" />
  <circle cx="144" cy="106" r="6" fill="#ffffff" />

  <!-- Surprised 'O' Mouth -->
  <circle cx="120" cy="126" r="7" fill="#38bdf8" />
</svg>
