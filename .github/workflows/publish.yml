name: Publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require an OIDC-capable npm CLI
        run: node -e "const {execSync}=require('node:child_process'); const [major,minor,patch]=execSync('npm --version').toString().trim().split('.').map(Number); if(major<11 || (major===11 && (minor<5 || (minor===5 && patch<1)))) process.exit(1)"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
      - name: Tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import fs from 'node:fs'; const {version}=JSON.parse(fs.readFileSync('package.json','utf8')); if (process.env.RELEASE_TAG !== 'v'+version) { console.error('Tag does not match package.json version'); process.exit(1); }"
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
