name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint check
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests and print coverage
        run: npm test

      - name: Verify reproducible CLI demo
        run: |
          npm run docs:demo
          git diff --exit-code -- docs/demo.svg

      - name: Build library and declarations
        run: npm run build

      - name: Check package contents
        run: npm pack --dry-run

  render-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx remotion still src/index.ts ThermosExplainer out/still.png --frame=60
      - uses: actions/upload-artifact@v7
        with:
          name: thermos-still
          path: out/still.png
          if-no-files-found: error
