version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      remotion:
        patterns:
          - remotion
          - "@remotion/*"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
